services:
  db:
    image: postgres:16-alpine
    container_name: borrowbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: borrowbox
      POSTGRES_PASSWORD: borrowbox
      POSTGRES_DB: borrowbox
    ports:
      - "5432:5432"
    volumes:
      - borrowbox-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borrowbox -d borrowbox"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  borrowbox-pgdata:
