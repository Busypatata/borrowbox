# Render blueprint for the API. Create a Neon database first and paste its connection strings into the dashboard.
services:
  - type: web
    name: borrowbox-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build -w shared && npm run build -w server
    preDeployCommand: npm run db:deploy -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/v1/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, sync: false }      # Neon connection string (use the DIRECT, non-pooled URL so migrations work)
      - { key: CLIENT_URL, sync: false }        # https://your-app.vercel.app
      - { key: SESSION_SECRET, generateValue: true }
      - { key: CSRF_SECRET, generateValue: true }
      - { key: CLOUDINARY_CLOUD_NAME, sync: false }
      - { key: CLOUDINARY_API_KEY, sync: false }
      - { key: CLOUDINARY_API_SECRET, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASSWORD, sync: false }
      - { key: EMAIL_FROM, sync: false }
